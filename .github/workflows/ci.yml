name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Habits
  PROJECT: Habits.xcodeproj

jobs:
  test:
    name: Build & test (Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version && xcrun simctl list runtimes

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS-"))
                      | .value[] | select(.name | startswith("iPhone"))
                      | .udid] | last')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # UI tests are skipped: the app asks for notification permission on launch,
      # so the system alert makes them flaky here. Drop -skip-testing to run them.
      - name: Test
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null; then FMT=xcbeautify; else FMT=cat; fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:HabitsUITests \
            CODE_SIGNING_ALLOWED=NO \
            | "$FMT"

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  build-device:
    name: Build unsigned (device slice)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Build for iOS device without signing
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null; then FMT=xcbeautify; else FMT=cat; fi
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | "$FMT"
